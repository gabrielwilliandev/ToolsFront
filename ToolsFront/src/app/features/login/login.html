<div class="main">
    <div class="cabecalho">
        <mat-icon>plumbing</mat-icon>
        <h1 class="glass-title" data-text="TOOLS">TOOLS</h1>
        <h3>Entre para gerenciar suas listas</h3>
    </div>
    
        <form [formGroup]="form" (ngSubmit)="login()" class="login">
            <h1>ENTRAR</h1>
            <input type="text" placeholder="Email*" formControlName="email">
            <input type="password" placeholder="Senha*" formControlName="password">
            <app-button type="salvar" label="Entrar"></app-button>
            <h3>Não tem uma conta? <a routerLink="/register">Registre-se</a></h3>
        </form>
    
</div>
